
spring.application.name=femora-backend

# Database Configuration
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/femora_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ML API Configuration
ml.pcos.url=${PCOS_URL:http://localhost:8000/pcos}
ml.general.url=${GENERAL_URL:http://localhost:8000/general}

# Geoapify
femora.geoapify.key=${GEOAPIFY_KEY:}

# JWT Configuration
femora.jwt.secret=${FEMORA_JWT_SECRET:}
femora.jwt.hours=12



# OTP Configuration
femora.otp.log-code=false
femora.mail.from-name=Femora

# Reminder Configuration
femora.reminder.days-before=2
femora.reminder.cron=0 0 9-20 * * *
femora.reminder.calendar-cycles=3
femora.reminder.calendar-discreet=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}


# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000



